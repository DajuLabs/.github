name: PR Signals (reusable)

# Called from every repo's own .github/workflows/pr-signals.yml (see
# workflows-caller/pr-signals.yml in this same package). Posts a Teams
# alert for the PR with detected vs. declared impact signals and flags a
# wrong base branch. Does NOT comment on the PR itself (removed for now —
# re-add a `scan --comment` step here if that's wanted later).

on:
  workflow_call:
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true

permissions:
  pull-requests: read
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pr-signals.sh from the central .github repo
        uses: actions/checkout@v4
        with:
          repository: DajuLabs/.github
          path: dajulabs-tools

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Alert Teams for this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dajulabs-tools/scripts/pr-signals.sh
          dajulabs-tools/scripts/pr-signals.sh alert \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --teams-webhook "${{ secrets.TEAMS_WEBHOOK_URL }}"
